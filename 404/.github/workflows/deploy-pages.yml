name: Publier le site et detecter les peluches
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Construire le site et generer les listes de peluches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path('.')
          out = Path('_site')
          excluded = {'.git', '.github', '_site', 'node_modules', '.venv', '__pycache__'}
          out.mkdir(exist_ok=True)
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = out / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              elif item.is_file():
                  shutil.copy2(item, target)
          for folder in out.rglob('peluches'):
              if not folder.is_dir() or folder.parent.name != 'assets':
                  continue
              site = folder.parent.parent
              files = sorted(
                  (p for p in folder.iterdir() if p.is_file()
                   and p.suffix.lower() in {'.png', '.webp', '.jpg', '.jpeg', '.avif'}),
                  key=lambda p: (p.stem != 'Bambietta Basterbine', p.name.casefold())
              )
              paths = [p.relative_to(site).as_posix() for p in files]
              (site / 'peluches.json').write_text(
                  json.dumps(paths, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              print(f'{site}: {len(paths)} peluche(s)')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
