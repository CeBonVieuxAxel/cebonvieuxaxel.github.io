<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undercover</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
<style>
:root { --bg: #121413; --fg: #f3f1ea; --muted: #b9bbb3; color-scheme: dark; }
:root[data-theme="light"] { --bg: #fff6f9; --fg: #2a1520; --muted: #7b5b6a; color-scheme: light; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: "Neucha", "Segoe Print", "Comic Sans MS", cursive; font-size: 18px; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
h1 { font-family: "Caveat", "Segoe Print", cursive; font-size: clamp(3.4rem, 14vw, 6rem); margin: 0 0 8px; line-height: 1; }
p { color: var(--muted); margin: 0 0 22px; }
a { color: var(--fg); border: 2px dashed var(--muted); border-radius: 12px 5px 11px 6px; padding: 10px 18px; text-decoration: none; display: inline-block; }
a:focus-visible, a:hover { border-style: solid; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Neucha&display=swap">
</head>
<body>
<main>
<h1>404</h1>
<p>Cette page n'existe pas. / This page does not exist. / Такой страницы нет.</p>
<a id="home" href="/">Undercover</a>
</main>
<script>
(function () {
  var h = document.getElementById("home"), seg = location.pathname.split("/")[1];
  if (/\.github\.io$/.test(location.hostname) && seg) h.href = "/" + seg + "/";
})();
</script>
</body>
</html>
